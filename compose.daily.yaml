name: ghostfolio-boursedirect-daily
services:
  preview:
    build:
      context: .
      dockerfile: Dockerfile.daily
    image: ${BOURSEDIRECT_DAILY_IMAGE:-ghostfolio-boursedirect-daily:local}
    init: true
    restart: "no"
    read_only: true
    user: "1000:1000"
    network_mode: none
    command:
      - --config
      - /inputs/${DAILY_CONFIG:-daily.yaml}
      - --input-root
      - /inputs
      - --max-bytes
      - "2000000"
      - --max-depth
      - "256"
    volumes:
      - type: bind
        source: ${DAILY_INPUT_DIR:-./inputs}
        target: /inputs
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${DAILY_WORK_DIR:-./tmp/daily-compose}
        target: /work
        bind: {create_host_path: false}
    cap_drop: [ALL]
    security_opt: [no-new-privileges]
    ulimits:
      core: {soft: 0, hard: 0}
    mem_limit: 512m
    cpus: 1
    pids_limit: 32
    logging: {driver: none}
