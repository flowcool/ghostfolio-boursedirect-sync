[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostfolio-boursedirect-sync"
version = "0.0.0"
requires-python = ">=3.15"

[tool.setuptools]
packages = ["ghostfolio_boursedirect_sync"]

[tool.ruff]
target-version = "py315"
extend-exclude = ["tmp", "audit"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["ghostfolio_boursedirect_sync"]

[tool.mypy]
python_version = "3.15"
strict = true
files = ["ghostfolio_boursedirect_sync"]
