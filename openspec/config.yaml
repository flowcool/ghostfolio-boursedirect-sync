schema: spec-driven

context: |
  Community Docker connector: Bourse Direct (PEA, PEA-PME) activities -> Ghostfolio.
  Docker-first, every setting through ENV, unattended run with `docker compose up -d`.
  Python, functional style, no classes, no type hints.
  Target contract = sibling forks ../ghostfolio-ibkr-sync and ../ghostfolio-degiro-sync:
  CRON, APPRISE_URLS, additive deduplicated import, ENV only.
  DRY_RUN=0 imports; DRY_RUN=1 simulates; an absent variable selects simulation.
  Reuse their mechanisms; do not design a new one they already have.
  v0.2 uses operation notices "avis d'opere" only, over a rolling 90-day window.
  Statements, account history and positions are not financial input sources.
  Login: Bitwarden CLI provides password and TOTP; three failed logins lock the account.
  v0.1.1 is a preview-only legacy release; v0.2 rebuilds a small product and reuses only
  the proven login flow and notice parser.
  Readers: the operator (infrastructure expert, not a developer) and community users.
  Writing style: ASD-STE-100 Simplified Technical English in proposal, specs, design and tasks:
  short sentences, one idea per sentence, active voice, no internal jargon or invented labels.
  The operator must be able to validate each artifact without reading code.
  A changed decision is applied to proposal, specs, design and tasks before commit.

rules:
  proposal:
    - Max 400 words. Plain English, no internal jargon.
    - Include an in-scope / out-of-scope table that lists every Bourse Direct operation type considered.
    - Build that table from saved real documents of the chosen source; when the source changes, rebuild it.
    - Include a "Non-goals" section.
  specs:
    - Every requirement has at least one WHEN/THEN scenario that a person can check by running one command and reading its output.
    - Never state Bourse Direct page or document behavior that is not observed in a saved real document; mark unknowns as open questions.
  design:
    - Max 400 words. Name the sibling file or mechanism reused for each part.
  tasks:
    - One task = one vertical slice that ends with a runnable check, about one hour of work.
    - First task = one real BUY processed in dry-run with docker compose up, without TTY; reuse sibling import mechanisms, do not create a Ghostfolio lab.
    - No task for internal tooling, lab proofs, process automation or docs beyond README.
    - 'Exception approved by Florent 2026-10-14 for bounded-operation-tooling (infra-srpp) only: offline operation tooling, offline process automation and isolated synthetic tests are permitted; the first real-BUY task requirement and internal-tooling/process-automation prohibitions do not apply. Keep approximately one-hour vertical slices, existing financial commands, separate infra-a3ri scope, ENV-only credentials and README-only user documentation. This exception grants no implementation, installation, real access or merge authority; future execution requires a separately validated Operation plan.'
