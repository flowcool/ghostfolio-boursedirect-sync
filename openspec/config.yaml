schema: spec-driven

context: |
  Community Docker connector: Bourse Direct (PEA, PEA-PME) activities -> Ghostfolio.
  Docker-first, every setting through ENV, unattended run with `docker compose up -d`.
  Follow the latest qualified stable Python, Node and base-image releases.
  Keep exact pins, renewed image digests, compatibility tests, security scans and review.
  Functional style, typed application package ghostfolio_boursedirect_sync.
  Strict mypy and Ruff; frozen dataclasses and typed dictionaries describe data only.
  Money and position decisions use Decimal. Application Python totals at most 2500 lines.
  Target contract = sibling forks ../ghostfolio-ibkr-sync and ../ghostfolio-degiro-sync:
  CRON, APPRISE_URLS, additive deduplicated import, ENV only.
  BD exception: only the exact BUY fee correction defined in the active spec.
  Preserve all other fields and identity; confirm readback; never delete.
  DRY_RUN=0 imports; DRY_RUN=1 simulates; an absent variable selects simulation.
  Reuse their mechanisms; do not design a new one they already have.
  v1 rebuild (option B): adopt the complete applicable common core from IBKR v3.0.0.
  Cover its implemented runtime and release requirements, with explicit BD adaptations.
  Follow its modules and typed functions; classes describe data.
  Read the design coverage table and pinned source before coding.
  Review later source updates separately; no shared library or automatic core projection.
  Source: PDF operation notices "avis d'opere", downloaded by BillCollector (Playwright)
  and published to Paperless; the importer reads them through the Paperless API, read only.
  The importer has no broker login and no vault; BillCollector owns them.
  v0.1.1 is a preview-only legacy release; the previous work stays in Git tag legacy-wip.
  Readers: the operator (infrastructure expert, not a developer) and community users.
  Writing style: ASD-STE-100 Simplified Technical English in proposal, specs, design and tasks:
  short sentences, one idea per sentence, active voice, no internal jargon or invented labels.
  The operator must be able to validate each artifact without reading code.
  A changed decision is applied to proposal, specs, design and tasks before commit.
  An error case absent from the complete available archive needs no new original.
  Verify its logged error and write protection with explicit derived-data regressions.
  Never alter original PDFs or claim a real financial observation for that case.

rules:
  proposal:
    - Max 400 words. Plain English, no internal jargon.
    - Include an in-scope / out-of-scope table that lists every Bourse Direct operation type considered.
    - Build that table from saved real documents of the chosen source; when the source changes, rebuild it.
    - Include a "Non-goals" section.
  specs:
    - Max 1800 words. Describe visible behavior and error codes only, never internal mechanisms.
    - Every requirement has at least one WHEN/THEN scenario that a person can check by running one command and reading its output.
    - Never state Bourse Direct page or document behavior that is not observed in a saved real document; mark unknowns as open questions.
  design:
    - Max 400 words. Name the sibling file or mechanism reused for each part.
  tasks:
    - One task = one vertical slice that ends with a runnable check, about one hour of work.
    - First task = one real BUY processed in simulation with the spec run command, without TTY; adopt the applicable IBKR startup core. Reuse the existing infra lab for later import qualification.
    - Keep lab tooling in infra and reuse existing release work items. Include their acceptance gates with import and release delivery; add no separate tooling tasks or docs beyond README.
