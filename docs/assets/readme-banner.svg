    <text x="54" y="116" fill="#f4f7fb" font-size="44" font-weight="700" letter-spacing="-1">Bourse Direct to Ghostfolio</text>
    <text x="56" y="156" fill="#c4dce5" font-size="23">Bourse Direct PDF notices → self-hosted Ghostfolio</text>
    <g fill="#102c39" stroke="#466879" stroke-width="1">
      <rect x="56" y="198" width="284" height="104" rx="16"/>
      <rect x="458" y="198" width="284" height="104" rx="16"/>
