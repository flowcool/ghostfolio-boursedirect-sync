<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Bourse Direct to Ghostfolio</title>
  <desc id="desc">Original PDF notices pass through the importer to a self-hosted Ghostfolio portfolio. Preview, check, then import.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#123d47"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#64e0c5"/>
      <stop offset="1" stop-color="#8ed1ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#background)"/>
  <circle cx="1120" cy="30" r="230" fill="#64e0c5" opacity=".05"/>
  <path d="M0 306C240 248 354 360 630 290S982 244 1200 282V360H0Z" fill="#071722" opacity=".55"/>
