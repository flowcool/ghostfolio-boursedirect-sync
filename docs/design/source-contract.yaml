schema_version: 1
authority:
  plan: docs/plans/2026-10-08-manual-document-import.md
  source_acceptance_issue: infra-4g8u.4
  probe_issue: infra-4g8u.7
document_kinds:
  monthly_statement:
    input: local_saved_html
    evidence:
      observed_layout: FINDINGS.md#10-phase-0--supplied-statement-html-source-2026-10-08
      synthetic_fixture: tests/fixtures/statement-synthetic.html
      interactive_observation: FINDINGS.md#12-authorized-online-source-inspection-2026-10-08
      limitation: Four UTF-8 DOM captures inspected, including three adjacent months
        and earliest offered month; all reconcile. Original response bytes, all-month
        continuity and revisions unverified.
      resumed_observation: FINDINGS.md#13-resumed-source-characterization-2026-10-08
    parser_variant:
      columns:
      - Date
      - Désignation
      - Débit (€)
      - Crédit (€)
      relationship: four_parallel_nested_tables_with_blank_slots
      encoding_candidates:
      - windows-1252
      - utf-8
      controls:
      - opening_balance
      - cumulative_including_opening_columns
      - closing_balance
    executable_scope: inspect_and_reconcile_only
    import_ready: false
  contract_note:
    input: local_saved_html
    evidence:
      observed_layout: FINDINGS.md#13-resumed-source-characterization-2026-10-08
      synthetic_fixtures:
      - tests/fixtures/note-buy-synthetic.html
      - tests/fixtures/note-multi-sell-synthetic.html
      pairing: Three monthly trades each uniquely match saved notes by date, type,
        quantity, price and net debit/credit.
      limitation: Two daily DOM captures only; price currency, additional taxes, timezone,
        revisions and identical-trade multiplicity unverified.
    executable_scope: inspect_explicit_fields_and_exact_match_only
    parser_variant:
      columns:
      - Date
      - Désignation
      - Débit (€)
      - Crédit (€)
      relationship: four_parallel_nested_tables_with_blank_slots
      designation: nested_three_cell_field_tables
      observed_slot_counts:
      - 9
      - 18
      observed_fields:
      - operation_label
      - isin
      - quantity
      - course
      - gross
      - brokerage
      - vat
      - execution_time
      - venue
      net_currency: EUR
      price_currency: EUR_explicit_user_configuration_for_selected_sample_not_inferred_from_header
      unique_operation_reference: not_observed
operation_types:
  buy:
    labels:
    - 'ACH CPT '
    probe: ledger_trade_fields_only
    import_support: conditional_on_explicit_mapping_and_financial_identity_api_gates
    missing_evidence:
    - broader_tax_semantics
    - identical_trade_multiplicity
    source_matching: observed_unique_in_three_trade_sample
    source_cost_relationship: gross_plus_brokerage_plus_vat_equals_debit
  sell:
    labels:
    - 'VTE CPT '
    probe: ledger_trade_fields_only
    import_support: conditional_on_explicit_mapping_and_financial_identity_api_gates
    missing_evidence:
    - broader_tax_semantics
    - identical_trade_multiplicity
    source_matching: observed_unique_in_three_trade_sample
    source_cost_relationship: gross_minus_brokerage_minus_vat_equals_credit
  other:
    probe: preserve_as_unknown_and_block
    import_support: blocked
    missing_evidence:
    - representative_documents
    - approved_financial_semantics
    observed_categories:
    - coupons
    - split
    - securities_withdrawal
    - unclassified_other
history:
  offered_statement_months_observed: 21
  retention_promise: false
  completeness_proven: false
  required_evidence:
  - all_month_continuity_if_backfill_requested
  - existing_activity_adoption
  - chosen_history_cutoff
  - note_calendar_depth
  adjacent_cash_continuity_observed: true
  earliest_offered_month_document_inspected: true
  opening_history_source: user_reports_existing_ghostfolio_acquisitions
  opening_history_audited: false
source_acceptance:
  recommendation: go_for_user_approved_strict_trade_scope_with_fail_closed_currency_mapping
  scope_approval: user_accepted_strict_buy_sell_scope_with_explicit_currency_and_unsupported_period_blocking
  blocking_conditions: []
  full_operation_sync_proven: false
  currency_basis: explicit_user_confirmation_for_selected_PEA_sample_corroborated_by_net_EUR_headers_and_exact_note_arithmetic
target_service:
  authority: Florent confirmed the architecture grilling on 2026-10-10; online-source-inspection.md#automatic-service-target-decision
  implementation_status: design_only_existing_runtime_gates_retained
  product_boundary: independent_bourse_direct_service
  delivery: incremental_source_owned_compose_infra_owned_deployment
  trigger:
    scheduled: daily
    manual: operator_command_or_infrastructure_job
    concurrency: one_active_run_per_account
  account_scope:
    discovery: enumerate_all_accessible_broker_accounts_and_verify_expected_private_inventory
    binding: explicit_verified_broker_account_to_distinct_ghostfolio_account
    identity_namespace: broker_account_in_every_operation_identity_and_reconciliation
    isolation: separate_acquisition_coverage_deduplication_and_exception_state_per_account
    missing_or_ambiguous_account: quarantine_account_binding_without_implicit_default
    evidence: actual_authenticated_account_identifiers_required_before_activation
  history:
    rolling_days: 90
    revisit_window_each_run: true
    deduplicate_prior_imports: true
    coverage_basis: durable_last_completed_acquisition_period_not_last_run_start
    gap_outside_rolling_window: block_daily_and_manual_resume_until_explicit_coverage_resolution
    gap_resolution: verified_catchup_if_source_available_or_explicit_operator_acknowledgment_of_missing_period
    unresolved_quarantined_operations: remain_pending_in_durable_journal_independent_of_window
  pipeline:
  - independent_vault_session
  - guarded_source_acquisition
  - local_document_conversion
  - certain_unique_existing_activity_reconciliation
  - automatic_new_qualified_activity_import
  existing_activity_policy:
    required_match: globally_unique_one_to_one_exact_available_financial_fields_and_verified_date_semantics
    assignment_scope: all_source_operations_and_eligible_remote_records_in_reconciliation
    remote_record_reuse: forbidden
    multiplicity_conflict: quarantine_all_affected_operations_no_already_imported_classification
    fields:
    - account
    - security
    - side
    - quantity
    - price
    - fee
    - currency
    - date
    ambiguous_or_changed: quarantine_conflict
    automatic_financial_rewrite: false
    automatic_delete: false
    manual_resolution_for_normal_certain_match: not_required_in_target_not_yet_implemented
  unknown_operation_policy:
    quarantine: unknown_operation_and_demonstrated_dependents
    continue: independent_qualified_operations
    implemented_period_blocking: unchanged_until_dependency_proof_and_reviewed_implementation
  authentication_uncertainty: stop_no_automatic_retry
  operator_interface: commands_and_private_exception_review_artifacts
  notification:
    existing_provider: ntfy
    when: intervention_required
    public_content: fixed_codes_and_counts_only
  retention:
    journal: durable
    acquired_documents: durable_beyond_collection_window
    storage: private_persistent_volume
    backup_and_restore: infra_verified_before_activation
    sessions_and_secrets: excluded_from_public_config_and_notifications
  activation_gates:
  - actual_source_and_authentication_observations
  - financial_and_date_semantics
  - complete_target_context_and_opening_history
  - isolated_api_number_date_and_recovery_qualification
  - external_security_review
  - separate_concrete_production_write_authorization
