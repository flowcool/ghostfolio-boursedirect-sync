name: Bug report
description: Report a connector failure with fixed error codes and non-sensitive metadata.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        Docker log retention is disabled; the attached terminal still receives fixed result/error codes.
        Share only fixed codes, exit status, release/image digest, architecture and Docker/Compose versions.
        Do not retry a failed broker login to collect output or remove authentication journals.
        Never post .env, resolved Compose configuration, container inspection output, account choices,
        credentials, private URLs, portfolio details, raw HTML, snapshots, reports or acquisition receipts.
        Use synthetic examples for financial behavior. Report security vulnerabilities privately:
        https://github.com/flowcool/ghostfolio-boursedirect-sync/security/advisories/new
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Connector release/image digest from Compose or IMAGE_DIGEST, CPU architecture (uname -m), Docker and Compose versions. For a source checkout, also give Python and Node.js versions.
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Released AMD64 Docker Compose connector
        - Local AMD64 source build
        - Offline saved-input preview
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Fixed result code and exit status
      description: Copy only the final JSON code field and exit status (0, 1 or 2), not the full terminal transcript. Examples include SOURCE_CONNECT_REFUSED, SOURCE_PROXY_UNAVAILABLE, GHOSTFOLIO_ACCESS_REFUSED, ACCOUNT_BINDING_CONFLICT or COMMUNITY_DRY_RUN_COMPLETED. If no code appeared, say so without retrying authentication.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Explain what is missing or incorrect without identifying your accounts or portfolio.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction and sanitized evidence
      description: Describe steps already taken and synthetic examples if needed. Share fixed error codes only; retain private receipts locally. Do not attempt another broker login solely to fill this form.
    validations:
      required: true
