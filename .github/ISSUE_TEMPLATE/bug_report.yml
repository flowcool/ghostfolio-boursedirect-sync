name: Bug report
description: Report a failure with fixed codes and sanitized metadata.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        Keep original PDFs, review files, full financial logs, account IDs, private URLs and credentials private.
        Never attach .env, resolved Compose output, container inspection, snapshots or acquisition receipts.
        The importer has no broker login. Do not delete recovery journals or resend uncertain writes.
        Report vulnerabilities through the security policy, not a public bug report:
        https://github.com/flowcool/ghostfolio-boursedirect-sync/security/policy
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Connector release/image digest, Ghostfolio, Docker and Compose versions. Add Paperless version only when used.
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Notice source
      options:
        - Read-only PDF folder
        - Paperless-ngx
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - linux/amd64
        - linux/arm64
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Released Docker Compose image
        - Local source build
        - Offline tests
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Fixed error code, cycle result and exit status
      description: Share only codes such as notice_unreadable, notice_source_unavailable, unresolved_security or import_unconfirmed, plus exit 0 or 1. Exit 0 can still require user action. Say when no code appeared.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Explain the failure without identifying accounts or portfolio details.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal sanitized reproduction
      description: Describe existing steps and independent synthetic examples. Keep private evidence locally. Do not resend a financial request to fill this form.
    validations:
      required: true
