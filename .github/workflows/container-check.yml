name: Native connector image
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  container-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          pull: true
          tags: sync-check:ci
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
      - name: Smoke the actual AMD64 connector image offline
        run: |
          docker load --input "${{ runner.temp }}/image.tar"
          bash scripts/smoke-connector-image.sh sync-check:ci
      - name: Scan image for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          input: ${{ runner.temp }}/image.tar
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
