# Adapted from IBKR 9716103 release-image.yml:240-277.
# Publishing the prepared stable GitHub release is a separate operator GO.
name: Publish qualified release image
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: release-image
  cancel-in-progress: false
jobs:
  codeql:
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: write
  dependency-review:
    uses: ./.github/workflows/dependency-review.yml
  promote:
    needs: [codeql, dependency-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
      - run: pip install -r requirements.txt
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check exact tag, main ancestry and authenticated version absence
        run: python scripts/release_image.py --registry-login --registry
      - name: Verify the frozen digest-pinned operator bundle
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python scripts/promote_release_image.py --plan
          digest=$(python -c 'import json; print(json.load(open("release-qualification.json"))["digest"])')
          docker buildx imagetools inspect --raw "ghcr.io/$GITHUB_REPOSITORY@$digest" > release-manifest.json
          python scripts/release_package.py --tag "$RELEASE_TAG" --output-dir dist \
            --image-digest "$digest" \
            --image-manifest release-manifest.json --qualification release-qualification.json \
            --release-notes release-notes.md
          # Immutable releases already contain every asset from the draft.
          # Compare deterministic bytes. Never replace or append published assets.
          gh release download "$RELEASE_TAG" --dir published \
            --pattern '*.tar.gz' --pattern SHA256SUMS --pattern IMAGE_DIGEST
          cmp dist/SHA256SUMS published/SHA256SUMS
          cmp dist/IMAGE_DIGEST published/IMAGE_DIGEST
          for archive in dist/*.tar.gz; do
            cmp "$archive" "published/$(basename "$archive")"
          done
          (cd published && sha256sum -c SHA256SUMS)
      - name: Verify lab qualification, signature and source; promote exact bytes
        run: python scripts/promote_release_image.py --publish
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-manifest
          path: release-manifest*
          if-no-files-found: warn
