name: Build release bundle and image

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.16'
      - name: Validate stable tag, checked-out commit, and release notes
        run: python scripts/release_package.py --tag "$RELEASE_TAG" --check-only
      - name: Render public release-note links
        run: |
          python - <<'PYNOTES'
          import os
          from pathlib import Path
          from scripts.release_package import rewrite_markdown_links
          root = Path.cwd()
          tag = os.environ["RELEASE_TAG"]
          name = "docs/releases/" + tag + ".md"
          notes = rewrite_markdown_links(name, (root / name).read_bytes(), set(), root, tag)
          title = notes.decode("utf-8").splitlines()[0].removeprefix("# ").strip()
          if title != tag and not title.startswith(tag + " — "):
              raise ValueError("release note heading must start with the release tag")
          (Path(os.environ["RUNNER_TEMP"]) / "release-notes.md").write_bytes(notes)
          (Path(os.environ["RUNNER_TEMP"]) / "release-title").write_text(title, encoding="utf-8")
          PYNOTES
      - name: Install pinned offline test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run release packaging regressions
        run: python -m pytest tests/test_release_package.py -q
      - name: Refuse an existing GitHub release or GHCR version tag
        run: |
          release_file="$RUNNER_TEMP/existing-release"
          release_error="$RUNNER_TEMP/existing-release-error"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" >"$release_file" 2>"$release_error"; then
            echo "GitHub release $RELEASE_TAG already exists; release artifacts are immutable." >&2
            exit 1
          elif ! grep -Fq 'HTTP 404' "$release_error"; then
            echo "Could not confirm that the GitHub release version is unused." >&2
            exit 1
          fi
          tags_file="$RUNNER_TEMP/ghcr-tags"
          error_file="$RUNNER_TEMP/ghcr-tags-error"
          if gh api --paginate "users/flowcool/packages/container/ghostfolio-boursedirect-sync/versions?per_page=100" --jq '.[].metadata.container.tags[]?' >"$tags_file" 2>"$error_file"; then
            if grep -Fxq "$RELEASE_TAG" "$tags_file"; then
              echo "GHCR already contains $RELEASE_TAG; release tags are immutable." >&2
              exit 1
            fi
          elif grep -Fq 'HTTP 404' "$error_file"; then
            : # The package does not exist yet.
          else
            echo "Could not confirm that the GHCR version is unused." >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the AMD64 release image once
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          pull: true
          tags: ${{ env.IMAGE }}:${{ env.RELEASE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
      - name: Retain the exact image ID before scan and smoke
        id: checked_image
        run: |
          checked_image_id=$(docker image inspect --format '{{.Id}}' "$IMAGE:$RELEASE_TAG")
          printf '%s\n' "$checked_image_id" > "$RUNNER_TEMP/checked-image-id"
          printf 'image_id=%s\n' "$checked_image_id" >> "$GITHUB_OUTPUT"
      - name: Scan the image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: ${{ steps.checked_image.outputs.image_id }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
      - name: Smoke the pinned CLI, Python dependencies, and Node runtime offline
        run: bash scripts/smoke-connector-image.sh "$(cat "$RUNNER_TEMP/checked-image-id")"
      - name: Publish the checked image
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the exact image that passed scan and smoke checks
        run: |
          test "$(docker image inspect --format '{{.Id}}' "$IMAGE:$RELEASE_TAG")" = "$(cat "$RUNNER_TEMP/checked-image-id")"
          docker push "$IMAGE:$RELEASE_TAG"
      - name: Create deterministic operator bundle pinned to the pushed image digest
        run: |
          image_reference=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$RELEASE_TAG")
          case "$image_reference" in
            "$IMAGE"@sha256:*) ;;
            *) echo 'Pushed image digest is missing or belongs to another repository.' >&2; exit 1 ;;
          esac
          docker buildx imagetools inspect --raw "$image_reference" > "$RUNNER_TEMP/image-manifest.json"
          python scripts/release_package.py --tag "$RELEASE_TAG" --output-dir dist \
            --image-digest "${image_reference#*@}" --image-manifest "$RUNNER_TEMP/image-manifest.json" \
            --checked-image-id "$(cat "$RUNNER_TEMP/checked-image-id")"
      - name: Create a draft release with the operator bundle and categorized changelog
        run: >-
          gh release create "$RELEASE_TAG" --draft --verify-tag
          --title "$(cat "$RUNNER_TEMP/release-title")"
          --generate-notes --notes-file "$RUNNER_TEMP/release-notes.md"
          dist/*.tar.gz dist/SHA256SUMS dist/IMAGE_DIGEST

  promote-latest:
    if: github.event_name == 'release' && github.event.release.prerelease == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Require the latest published release and a stable tag
        run: |
          python3 -c 'import os,re,sys; sys.exit(0 if re.fullmatch(r"v(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)", os.environ["RELEASE_TAG"]) else 1)'
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          test "$latest" = "$RELEASE_TAG"
      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Promote the published AMD64 image without rebuilding it
        run: |
          docker pull --platform linux/amd64 "$IMAGE:$RELEASE_TAG"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE:$RELEASE_TAG")" = linux/amd64
          docker buildx imagetools create --prefer-index=false --tag "$IMAGE:latest" "$IMAGE:$RELEASE_TAG"
