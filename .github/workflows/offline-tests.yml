name: Offline tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install pinned test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify versioned offline tests
        run: python -m pytest tests -q
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Install pinned collector unit dependencies
        run: npm ci --prefix collector --ignore-scripts --no-audit --no-fund
      - name: Verify socket-forbidden collector core
        run: npm test --prefix collector
      - name: Check whitespace
        env:
          REVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$REVIEW_BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            REVIEW_BASE_SHA=$(git hash-object -t tree /dev/null)
          fi
          git diff --check "$REVIEW_BASE_SHA" "$REVIEW_HEAD_SHA"
