name: Offline tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install pinned test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify versioned offline tests
        run: python -m pytest tests -q
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Install pinned collector unit dependencies
        run: npm ci --prefix collector --ignore-scripts --no-audit --no-fund
      - name: Verify socket-forbidden collector core
        run: npm test --prefix collector
      - name: Check whitespace
        env:
          REVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$REVIEW_BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            REVIEW_BASE_SHA=$(git hash-object -t tree /dev/null)
          fi
          git diff --check "$REVIEW_BASE_SHA" "$REVIEW_HEAD_SHA"
