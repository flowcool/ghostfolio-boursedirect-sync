name: Offline tests

on:
  # Runs on every PR (it also checks documentation links); no re-run after merge.
  pull_request:

permissions:
  contents: read

concurrency:
  group: offline-tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.1"
      - name: Install pinned test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps .
      - name: Check the typed application package
        run: |
          python -m ruff check ghostfolio_boursedirect_sync
          python -m mypy --strict ghostfolio_boursedirect_sync
      - name: Verify documentation local links
        run: python scripts/check-docs.py
      - name: Verify versioned offline tests
        run: python -m pytest tests -q
      - name: Check whitespace
        env:
          REVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$REVIEW_BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            REVIEW_BASE_SHA=$(git hash-object -t tree /dev/null)
          fi
          git diff --check "$REVIEW_BASE_SHA" "$REVIEW_HEAD_SHA"
