name: Offline tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install pinned test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify versioned offline tests
        run: python -m pytest tests -q
      - name: Check whitespace
        env:
          REVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$REVIEW_BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            REVIEW_BASE_SHA=$(git hash-object -t tree /dev/null)
          fi
          git diff --check "$REVIEW_BASE_SHA" "$REVIEW_HEAD_SHA"
