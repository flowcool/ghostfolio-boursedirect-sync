name: Offline tests

on:
  # Documentation checks run on every PR. Application checks run on code changes.
  pull_request:

permissions:
  contents: read

concurrency:
  group: offline-tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  documentation:
    outputs:
      code: ${{ steps.scope.outputs.code }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PYTHON'
          import os
          import subprocess
          from pathlib import Path
          code = True
          if os.environ['BASE'] and os.environ['HEAD']:
              changed = subprocess.check_output([
                  'git', 'diff', '--name-only', '--no-renames', '-z',
                  os.environ['BASE'] + '...' + os.environ['HEAD'],
              ]).split(b'\0')
              paths = [p.decode('utf-8', errors='surrogateescape') for p in changed if p]
              code = not paths or any(
                  not (p.startswith(('docs/', 'openspec/')) or p.endswith('.md') or p == 'llms.txt')
                  for p in paths
              )
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f"code={str(code).lower()}\n")
          PYTHON
      - name: Verify documentation local links
        if: ${{ !cancelled() }}
        run: python3 scripts/check-docs.py
      - name: Check whitespace
        if: ${{ !cancelled() }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE...$HEAD"
  tests:
    needs: documentation
    if: ${{ !cancelled() && (needs.documentation.result != 'success' || needs.documentation.outputs.code != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install pinned test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps .
      - name: Check the typed application package
        run: |
          python -m ruff check ghostfolio_boursedirect_sync
          python -m mypy --strict ghostfolio_boursedirect_sync
      - name: Verify versioned offline tests
        run: python -m pytest tests -q
