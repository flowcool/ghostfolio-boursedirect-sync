name: Dependency release watch

# The PDF importer no longer ships Bitwarden or Chrome. Keep the legacy
# workflow dormant until task 1.3 removes its scripts. Renovate owns packages.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-release-watch
  cancel-in-progress: false

jobs:
  notify:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - name: Open review issues for new binary releases
        run: python scripts/watch_dependency_releases.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
