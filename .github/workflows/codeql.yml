name: CodeQL

on:
  # Required on the final PR head. A later push needs a new draft -> ready transition.
  pull_request:
    types: [opened, ready_for_review]
  workflow_call:
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    uses: ./.github/workflows/pr-scope.yml
  analyze:
    needs: scope
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (needs.scope.result != 'success' || needs.scope.outputs.code != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: python
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          output: sarif-results
          wait-for-processing: true
      - name: Enforce CodeQL error and security thresholds
        run: python3 .github/scripts/check-codeql.py sarif-results
