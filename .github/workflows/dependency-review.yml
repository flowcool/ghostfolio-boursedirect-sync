name: Dependency Review

on:
  # Keep this required check absent until the final head is ready for review.
  pull_request:
    types: [ready_for_review]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PYTHON'
          import os
          import subprocess
          from pathlib import Path
          base, head = os.environ['BASE'], os.environ['HEAD']
          code = True
          if base and head:
              changed = subprocess.check_output([
                  'git', 'diff', '--name-only', '--no-renames', '-z',
                  os.environ['BASE'] + '...' + os.environ['HEAD'],
              ]).split(b'\0')
              paths = [p.decode('utf-8', errors='surrogateescape') for p in changed if p]
              code = not paths or any(
                  not (p.startswith(('docs/', 'openspec/')) or p.endswith('.md'))
                  for p in paths
              )
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              if not base or not head:
                  # Release callers check the exact source against its first parent.
                  base = subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip()
                  head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
              output.write(f"code={str(code).lower()}\nbase={base}\nhead={head}\n")
          PYTHON
      - if: ${{ !cancelled() && steps.scope.outputs.code != 'false' }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ steps.scope.outputs.base }}
          head-ref: ${{ steps.scope.outputs.head }}
          fail-on-severity: moderate
          fail-on-scopes: runtime, development, unknown
