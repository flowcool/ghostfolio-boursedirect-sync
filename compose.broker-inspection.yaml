# Explicit overlay for credential-free source observation, not an auth service.
# Combine with compose.lab.yaml; the community compose.yaml has its own native CLI.
# Infra must qualify proxy-only namespace ACLs before any browser exec.
# Requires Docker Compose supporting !reset; qualification host rendered with 5.1.3.
services:
  browser:
    network_mode: !reset null
    networks: [broker-inspection]

  broker-egress:
    profiles: [browser]
    image: python@sha256:05cda9777409a9c3ffddd94a4c476b79f0769a0b4857f0c7ed9226b6800b0d6f
    pull_policy: never
    entrypoint: [python3, -I, -B, /opt/vault-egress.py, --broker-inspection]
    user: "1000:1000"
    read_only: true
    restart: "no"
    volumes:
      - ./collector/vault-egress.py:/opt/vault-egress.py:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges]
    ipc: private
    mem_limit: 64m
    cpus: 1
    pids_limit: 32
    ulimits:
      core:
        soft: 0
        hard: 0
    logging:
      driver: none
    healthcheck:
      disable: true
    labels:
      proof.owner: ${VAULT_OWNER:?Supply the durable allocation owner}
    networks: [broker-inspection, broker-upstream]

networks:
  broker-inspection:
    external: true
    name: ${BROKER_INSPECTION_NETWORK:?Supply the separately qualified browser-only network}
  broker-upstream:
    external: true
    name: ${BROKER_UPSTREAM_NETWORK:?Supply the separately owned broker proxy upstream network}
