services:
  importer:
    build: .
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    environment:
      GHOST_HOST: ${GHOST_HOST:?Set the internal Ghostfolio service address}
      GHOST_ACCESS_TOKEN: ${GHOST_ACCESS_TOKEN:-}
      GHOST_TOKEN: ${GHOST_TOKEN:-}
      GHOST_ACCOUNT_NAME: ${GHOST_ACCOUNT_NAME:?Set the target account name}
      BD_ACCOUNT_REF: ${BD_ACCOUNT_REF:?Set the source account identifier}
      PAPERLESS_URL: ${PAPERLESS_URL:?Set the Paperless URL}
      PAPERLESS_TOKEN: ${PAPERLESS_TOKEN:?Set the read-only Paperless token}
      PAPERLESS_DONE_TAG: ${PAPERLESS_DONE_TAG:-ghostfolio-done}
      DRY_RUN: ${DRY_RUN-1}
      TZ: ${TZ:-}
      CRON: ${CRON:-}
      APPRISE_URLS: ${APPRISE_URLS:-}
      APPRISE_TIMEOUT: ${APPRISE_TIMEOUT:-10}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MAPPING_FILE: ${MAPPING_FILE:-}
    networks:
      - ghostfolio
    volumes:
      - ./config:/config:ro

networks:
  ghostfolio:
    external: true
    name: backend_ghost
