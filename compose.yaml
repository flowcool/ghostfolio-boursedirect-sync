services:
  importer:
    image: ${BOURSEDIRECT_IMAGE:-ghcr.io/flowcool/ghostfolio-boursedirect-sync:latest}
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    environment:
      GHOST_HOST: ${GHOST_HOST:?Set the final Ghostfolio URL}
      GHOST_ACCESS_TOKEN: ${GHOST_ACCESS_TOKEN:-}
      GHOST_TOKEN: ${GHOST_TOKEN:-}
      GHOST_ACCOUNT_NAME: ${GHOST_ACCOUNT_NAME:?Set the target account name}
      BD_ACCOUNT_REF: ${BD_ACCOUNT_REF:?Set the source account identifier}
      PAPERLESS_URL: ${PAPERLESS_URL:-}
      PAPERLESS_TOKEN: ${PAPERLESS_TOKEN:-}
      NOTICE_DIR: ${NOTICE_DIR:-}
      NOTICE_WAIVER_FILE: ${NOTICE_WAIVER_FILE:-}
      PAPERLESS_DONE_TAG: ${PAPERLESS_DONE_TAG:-ghostfolio-done}
      DRY_RUN: ${DRY_RUN-1}
      IMPORT_CREATE_FROM: ${IMPORT_CREATE_FROM-}
      NOTICE_COVERAGE: ${NOTICE_COVERAGE-0}
      TZ: ${TZ:-Europe/Paris}
      CRON: ${CRON:-}
      APPRISE_URLS: ${APPRISE_URLS:-}
      APPRISE_TIMEOUT: ${APPRISE_TIMEOUT:-10}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ACTIVITY_REVIEW_FILE: ${ACTIVITY_REVIEW_FILE:-}
      ACTIVITY_RECONCILIATION: ${ACTIVITY_RECONCILIATION:-off}
      MAPPING_FILE: ${MAPPING_FILE:-}
    volumes:
      - type: bind
        source: ./config
        target: /config
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ACTIVITY_REVIEW_DIRECTORY:-./review}
        target: /review
        bind:
          create_host_path: false
